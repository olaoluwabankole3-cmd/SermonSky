name: Web build check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build Expo web
        run: npm run build:web
